name: Verify JDK 25 review fixes

on:
  push:
    branches:
      - ci/verify-review-fixes-20260715

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with Maven
        run: mvn -B -ntp clean verify